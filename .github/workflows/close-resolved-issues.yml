name: Close resolved roadmap issues

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Close issues resolved by this merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ROADMAP.md holds open/in-progress phases; completed phases get
          # flushed to docs/ROADMAP-ARCHIVE.md (see ROADMAP.md's own note) —
          # scan both so an issue resolved by an already-archived phase still
          # gets closed on its first push to main.
          files="ROADMAP.md docs/ROADMAP-ARCHIVE.md"
          issue_nums=$(grep -hoP '^\s*-\s*\[x\].*\[#\K[0-9]+(?=\])' $files 2>/dev/null || true)
          if [ -z "$issue_nums" ]; then
            echo "No resolved issue references found in $files"
            exit 0
          fi
          sha="${{ github.sha }}"
          for num in $(echo "$issue_nums" | sort -un); do
            state=$(gh issue view "$num" --repo "$REPO" --json state -q .state 2>/dev/null || echo "MISSING")
            if [ "$state" = "OPEN" ]; then
              line=$(grep -hP "\[#${num}\]" $files | head -1 | sed -E 's/^\s*-\s*\[x\]\s*//')
              gh issue close "$num" --repo "$REPO" -c "Resolved by ROADMAP item: ${line} (merged in ${sha})."
              echo "Closed #$num"
            fi
          done

[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[project]
name = "telcontar"
version = "1.0.0"
description = "MCP-based local directory organizer, backend-agnostic (any OpenAI-compatible LLM)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "mcp>=1.28,<2",          # MCP Python SDK; cap at v2 stable boundary
    "openai>=2.43",          # OpenAI-compatible SDK (Azure / Mammouth)
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.6",     # text extraction from Office/binary formats (extras for PDF/Office deps)
    "python-dotenv>=1.2",    # .env loading
    "pydantic>=2.13",        # config + data validation
    "pydantic-settings>=2.14",  # Pydantic Settings integration
    "rich>=15.0",            # pretty CLI output / plan diffs
    "plyer>=2.1",            # cross-platform desktop notifications
    "keyring>=24.0",         # OS credential store for the API key
    "extract-msg>=0.55.0",
    "nicegui>=3.15.0",
    "pywebview>=5.4 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/reboulip/telcontar"
Repository = "https://github.com/reboulip/telcontar"
Issues = "https://github.com/reboulip/telcontar/issues"

[project.scripts]
telcontar        = "host.main:main"
telcontar-server = "server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=2.1",
    "ty>=0.0.70",
    "pre-commit>=4.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["host", "server", "config"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "profiles"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p nicegui.testing.user_plugin"
main_file = "host/web/main.py"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.ty.environment]
python-version = "3.12"
